# Ocean County, NJ — daily refresh (v5.5.0 §6).
#
# Generated from scaffold/ops/daily_refresh_template.yml. County-specific
# substitutions:
#   <COUNTY_SLUG>   → ocean_nj
#   <COUNTY_TODO>   → wired below
#
# Notes on this county's CI:
#   - S2 (Surrogate / Bluestone) needs Playwright → browser-sources step.
#   - S9 (NJOGIS) is a 166 MB ZIP download; enrichment step times out at
#     30 minutes for a 60-minute total job budget.
#   - GitHub Pages: deploys from `dashboard/` dir on publish.

name: daily-refresh

on:
  schedule:
    # 06:00 UTC = 02:00 ET. Ocean County sheriff PDFs refresh weekly
    # (Tuesdays); surrogate index is daily.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write    # commit refreshed enrichment / dashboard
  pages: write       # publish to GitHub Pages
  id-token: write    # OIDC token for Pages deploy

concurrency:
  group: daily-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Repo root on the import path so `python3 scrapers/...` / `scaffold/...`
    # can `from scrapers.X import ...` (CI ran from the script dir, not the repo
    # root, causing ModuleNotFoundError: No module named 'scrapers').
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pdfplumber dbfread pyshp jsonschema playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Clean data/raw/
        run: rm -rf data/raw/ && mkdir -p data/raw/

      - name: Run scrapers — primary event sources (S1 sheriff + S4 courts + blocked-source report)
        run: python3 scrapers/run_event_sources.py
        continue-on-error: false

      - name: S4 session health check (surfaces re-seed marker as warning)
        if: always()
        run: |
          if [ -f runs/ocean_nj/last_failed_refresh.json ]; then
            echo "::warning title=NJ Courts S4 session needs re-seed::$(jq -r '.needs_operator_action' runs/ocean_nj/last_failed_refresh.json)"
            cat runs/ocean_nj/last_failed_refresh.json
          else
            echo "S4 session health: OK (no re-seed marker present)"
          fi

      - name: Run scrapers — fragile browser sources (S2 surrogate via Playwright)
        run: python3 scrapers/run_browser_sources.py
        continue-on-error: true

      - name: Run scrapers — enrichment sources (S9 NJOGIS parcels + MOD-IV)
        run: python3 scrapers/run_enrichment_sources.py
        continue-on-error: false

      - name: Build leads (Phase 3 enrichment join)
        run: python3 scaffold/pipeline/ocean_nj_build_leads.py

      # ── DealMachine commercial enrichment (COMMERCIAL_ENRICHMENT_SOURCE) ──
      # Ocean-scoped, NOT framework canon (county #5 does not inherit it).
      # Enriches ACTIONABLE leads (S1 sheriff + S7c HLS Brick); probate gated out.
      # Incremental + small-batch (BATCH_SIZE=6): only NEW/changed leads and
      # PENDING_RETRY leads (API flapped last time) are re-fetched. GENUINE_NO_MATCH
      # leads (DealMachine has no record) are cached and NEVER retried. If the DM API
      # is down during a run, the health gate skips the fetch and the rest of the
      # refresh publishes (continue-on-error) — the board is never blocked; pending
      # leads retry next run.
      - name: Set up Node (DealMachine CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        continue-on-error: true

      - name: DealMachine enrichment — actionable leads only (Ocean-scoped)
        continue-on-error: true
        env:
          DEALMACHINE_API_KEY: ${{ secrets.DEALMACHINE_API_KEY }}
        run: |
          if [ -z "$DEALMACHINE_API_KEY" ]; then
            echo "::warning title=DealMachine enrichment skipped::DEALMACHINE_API_KEY secret not set — leads publish without DM enrichment"
            exit 0
          fi
          npm install -g @dealmachine/cli >/dev/null 2>&1 || { echo "::warning title=DealMachine CLI install failed::publishing without DM enrichment"; exit 0; }
          dm login --key "$DEALMACHINE_API_KEY" --quiet \
            || { echo "::warning title=DealMachine login failed (invalid key?)::publishing without DM enrichment"; exit 0; }
          python3 scrapers/dealmachine_enrich.py \
            || echo "::warning title=DealMachine enrichment errored::publishing without DM enrichment (see log)"

      - name: Render dashboard (Phase 4 §5 contract)
        run: python3 scaffold/pipeline/ocean_nj_render_dashboard.py

      - name: §5.11 stale-label scanner
        run: |
          python3 scaffold/ops/stale_label_scanner.py --county ocean_nj \
            || echo "::warning::stale-label scanner emitted findings (see job log)"
        continue-on-error: true   # known false-positive: Phoenix as a personal name

      - name: §6.4 publish gate (verify_refresh_publishable)
        id: gate
        run: |
          python3 scaffold/ops/refresh_verification_gate_cli.py \
              --scored-leads data/leads/scored_leads.json \
              --report-out data/leads/refresh_gate.json \
              --resolved-owner-floor 0.0 \
              --enrichment-join-unavailable
        continue-on-error: true

      - name: §6.5 publish or preserve last-good
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "publish: gate PUBLISH"
            # dashboard/ already up to date from render step
          else
            echo "preserve: gate DO_NOT_PUBLISH — last-good Pages stays live"
            mkdir -p runs/ocean_nj
            cp data/leads/refresh_gate.json runs/ocean_nj/last_failed_refresh.json || true
            # Restore previous dashboard from last successful commit
            git checkout HEAD~1 -- dashboard/ 2>/dev/null || true
          fi

      - name: Commit refreshed enrichment + dashboard (only on PUBLISH)
        if: steps.gate.outcome == 'success'
        run: |
          git config user.email "ci-bot@xcerebro.local"
          git config user.name  "xcerebro-ci-bot"
          # Stage only tracked/committable artifacts; tolerate ignored/missing paths
          # (data/raw/ is gitignored — never commit raw scrape output).
          git add dashboard/ data/leads/scored_leads.json data/leads/build_manifest.json \
                  data/leads/lead_archive.json 2>/dev/null || true
          # DealMachine enrichment cache (incremental gate) + provenance ledger
          git add data/enriched/dealmachine_cache.json data/enriched/dealmachine_results.json \
                  data/enriched/dealmachine_enrichment.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "daily refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # ── GoHighLevel direct push (CLIENT-SPECIFIC, Ocean-only, no middleware) ──
      # Diff today's actionable leads against data/exports/pushed_keys.json and
      # upsert only net-new contactable leads to the client's GHL. Probate is
      # gated out (actionable = sheriff + HLS Brick tax-default). SAFETY: the
      # push runs in DRY-RUN by default — it only POSTs to GHL when GHL_PUSH_LIVE
      # is "1". Uncomment that env line below to go live after mapping is signed
      # off. Every step is continue-on-error so GHL never blocks the refresh.
      - name: GHL diff — net-new contactable leads (Ocean-only)
        if: steps.gate.outcome == 'success'
        run: python3 scrapers/ghl_diff_new_leads.py
        continue-on-error: true

      - name: GHL push — upsert net-new leads to client GHL (Ocean-only)
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_PUSH_LIVE: "1"          # LIVE — upserts net-new leads to client GHL
          GHL_PUSH_DELAY_SEC: "1.0"   # ~1s/contact so the first batch doesn't burst rate limit
        run: python3 scrapers/ghl_push.py

      # NOTE: this step is intentionally NOT continue-on-error. Once GHL upserts
      # have happened, the ledger MUST reach remote — otherwise the next run sees
      # those leads as net-new and re-pushes them (duplicate upserts / duplicate
      # client SMS). A persistent push failure here is a REAL signal and should
      # go red. Transient github.com blips are absorbed by the retry loop.
      - name: Commit GHL ledger + export (only on PUBLISH)
        if: steps.gate.outcome == 'success'
        run: |
          git config user.email "ci-bot@xcerebro.local"
          git config user.name  "xcerebro-ci-bot"
          # pushed_keys.json is the source of truth for "already pushed"; the
          # latest export/log are committed for provenance/visibility.
          git add data/exports/pushed_keys.json data/exports/new_leads_latest.json \
                  data/exports/push_log_latest.json 2>/dev/null || true
          git diff --cached --quiet && { echo "ledger unchanged — nothing to commit"; exit 0; }
          git commit -m "GHL push ledger $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            # --autostash: later pipeline steps (gate/scanner) leave other tracked
            # files dirty; without it rebase aborts with "unstaged changes" and the
            # ledger never reaches remote (runs went red for days on exactly this).
            if git pull --rebase --autostash origin main && git push; then
              echo "ledger pushed (attempt $attempt)"; exit 0
            fi
            echo "::warning::ledger push attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::error title=GHL ledger push failed::Pushed leads are NOT ledgered — the next run will re-push them (duplicate SMS). Recover the ledger before the next run."
          exit 1

      # NOTE: No actions/upload-pages-artifact + actions/deploy-pages steps here.
      # This repo uses LEGACY branch-based Pages (build_type: legacy, source =
      # main:/), so the `git push` above already deploys the refreshed dashboard
      # to https://xcerebroai.github.io/ocean-nj-intel/dashboard/. The workflow
      # deploy-pages action requires build_type: workflow and fails with
      # "Missing environment" against legacy Pages — it was pure red noise.

      - name: Write failure report (DO_NOT_PUBLISH path)
        if: steps.gate.outcome != 'success'
        run: |
          mkdir -p runs/ocean_nj
          echo "Daily refresh DO_NOT_PUBLISH — see refresh_gate.json" \
              > runs/ocean_nj/last_refresh_failure.txt
